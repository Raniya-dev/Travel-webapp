<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">

</head>



<body>


    <div class="container-fluid  ">
        <div class="row justify-content-center align-content-center">
            <div class="card shadow p-4">

                <h2 class="text-center  mb-1">SignUp</h2>
                <form id="form">

                    <div class="mb-3">
                        <label for="fullname" class="form-label">FullName:</label>
                        <input type="text" class="form-control" id="fullname" required>
                        <div id="nameError" class="error"></div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="example@mail.com"
                            aria-describedby="emailHelp" required>
                        <div id="emailError" class="error"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phoneno" class="form-label">PhoneNumber:</label>
                        <input type="number" class="form-control" id="phoneno" required>
                        <div id="phonenoError" class="error"></div>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location/City:</label>
                        <input type="text" class="form-control" id="location" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                        <div id="passwordError" class="error"></div>
                    </div>
                    <div class="mb-3">
                        <label for="Confirmpassword">Confirm Password:</label>
                        <input type="password" class="form-control" id="Confirmpassword" required>
                        <div id="ConfirmedError" class="error"></div>

                    </div>
                    <button type="submit" class="btn btn-primary mb-3">Register</button>

                </form>
            </div>


        </div>





    </div>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>

    <script src="js/index.js"></script>


</body>

</html>
