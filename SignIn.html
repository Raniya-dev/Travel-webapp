<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">







</head>

<body>

    <div class="container d-flex   align-content-center">
        <div class="">
            <div class="">
                <div class="card shadow p-4">
                    <h2 class="text-center ">SignIn</h2>

                    <form id="form1">

                        <div class="mb-3">
                            <label for="Loginemail" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="Loginemail" required>

                        </div>
                        <div class="mb-3">
                            <label for="Loginpassword" class="form-label">Password:</label>
                            <input type="password" class="form-control" id="Loginpassword" required>
                        </div>
                        <p id="loginError" class="error"></p>

                        <button type="submit" class="btn btn-primary mb-3">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>

    <script>
           let loginform = document.getElementById("form1")
            let  Loginemail = document.getElementById("Loginemail")
            let Loginpassword = document.getElementById("Loginpassword")
            let errormsg  = document.getElementById("loginError")

            
            loginform.addEventListener("submit",function(e){
                e.preventDefault();
                
                let storedEmail = localStorage.getItem("email1");
                let storedPassword = localStorage.getItem("password1");
                if(!storedEmail || !storedPassword){
                    errormsg.textContent = "No user found. Please register first";
                    return;
                }
    
                if(Loginemail.value.trim()==storedEmail && Loginpassword.value.trim()==storedPassword){
                    window.location.href="index.html";
                }
                else{
                    errormsg.textContent ="Invalid email or password!";
                    errormsg.style.color = "red";
                    
                }
            })
    </script>

</body>

</html>
